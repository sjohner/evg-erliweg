name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - index.html
      - assets/**
      - data/**
      - scripts/**
      - package.json
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-data:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Energiedaten validieren
        run: npm run check:data

  deploy:
    needs: validate-data
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Statisches Artefakt vorbereiten
        run: |
          mkdir -p _site/assets _site/data
          cp index.html _site/
          cp -R assets/css _site/assets/
          cp -R assets/js _site/assets/
          if [ -d assets/images ]; then cp -R assets/images _site/assets/; fi
          cp data/energy-data.json _site/data/

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: GitHub Pages veroeffentlichen
        id: deployment
        uses: actions/deploy-pages@v4